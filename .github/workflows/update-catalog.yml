name: Update catalog

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: alphakit-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm ci --ignore-scripts

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Generate catalog update and health receipt
        run: python3 scripts/update_catalog.py --write --max-items 3 --archive-dir .cache/sources --receipt artifacts/update.json

      - name: Verify updated catalog against pinned source archives
        run: python3 qa/verify-catalog.py .cache/sources

      - name: Rebuild catalog index
        run: python3 scripts/build_index.py

      - name: Verify hosted mirror updates and fallback
        run: node qa/mirror-check.cjs

      - name: Check application JavaScript syntax
        run: node --check dist/app.js

      - name: Run complete browser verification before pushing
        shell: bash
        run: |
          set -euo pipefail
          web_root="$(mktemp -d)"
          ln -s "$GITHUB_WORKSPACE/dist" "$web_root/AlphaKit"
          python3 -m http.server 5188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/dist" >"$web_root/root-server.log" 2>&1 &
          root_pid=$!
          python3 -m http.server 5189 --bind 127.0.0.1 --directory "$web_root" >"$web_root/subpath-server.log" 2>&1 &
          subpath_pid=$!
          trap 'kill "$root_pid" "$subpath_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:5188/ >/dev/null && curl --silent --fail http://127.0.0.1:5189/AlphaKit/ >/dev/null; then break; fi
            sleep 0.2
          done
          mkdir -p .site-qa/root .site-qa/pages-subpath
          QA_OUTPUT_DIR="$GITHUB_WORKSPACE/.site-qa/root" BASE_URL=http://127.0.0.1:5188/ node qa/browser-check.cjs
          QA_OUTPUT_DIR="$GITHUB_WORKSPACE/.site-qa/pages-subpath" BASE_URL=http://127.0.0.1:5189/AlphaKit/ node qa/browser-check.cjs

      - name: Commit and push verified catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- dist/data/catalog.json dist/data/update-status.json dist/licenses maintenance/ledger.jsonl maintenance/discovery.json docs/CATALOG.md
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update AlphaKit catalog'
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main

      - name: Upload update receipt and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphakit-update-receipt
          path: |
            artifacts/update.json
            .site-qa/
          if-no-files-found: warn
